<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHIFT the Blame · 形态奔跑</title>
  <style>
/* ========== v3 低饱和三主题：背景 / 主交互色 / 危险色 三色制 ========== */
#app[data-skin='calm_green'] {
  --bg: #0e1512;
  --panel: rgba(24, 34, 29, 0.94);
  --line: rgba(143, 216, 176, 0.28);
  --accent: #8fd8b0;
  --accent-2: #6fcf97;
  --danger: #d97777;
  --text: #e6efe9;
  --muted: #8fa798;
  --shadow: 0 8px 26px rgba(0, 0, 0, 0.28);
}
#app[data-skin='warm_beige'] {
  --bg: #e6ddcb;
  --panel: #f6f0e2;
  --line: rgba(120, 96, 48, 0.28);
  --accent: #b08a3e;
  --accent-2: #d9b45c;
  --danger: #dd865e;
  --text: #3a3326;
  --muted: #857a64;
  --shadow: 0 8px 26px rgba(96, 76, 40, 0.18);
}
#app[data-skin='dusk_purple'] {
  --bg: #171527;
  --panel: rgba(35, 31, 56, 0.95);
  --line: rgba(111, 184, 217, 0.28);
  --accent: #6fb8d9;
  --accent-2: #8fcbe6;
  --danger: #c86aa8;
  --text: #e7e9f4;
  --muted: #9690b4;
  --shadow: 0 8px 26px rgba(0, 0, 0, 0.32);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
  background: #0a0c0e;
  color: var(--text);
  overflow: hidden;
}
#app {
  position: relative;
  height: 100vh;
  width: 100vw;
  background: var(--bg);
  color: var(--text);
  user-select: none;
  -webkit-user-select: none;
  transition: background 0.4s ease, color 0.4s ease;
}
.screen { position: absolute; inset: 0; }
.hidden { display: none !important; }

.kbd {
  display: inline-block;
  padding: 2px 10px;
  border: 1.5px solid var(--accent);
  border-radius: 8px;
  color: var(--accent);
  font-weight: 800;
}

/* ========== 主菜单 ========== */
#screen-menu {
  overflow: auto;
  padding: 32px 28px 48px;
  background: var(--bg);
}
.menu-head { text-align: center; margin-bottom: 26px; }
.game-title {
  font-size: clamp(34px, 5.5vw, 60px);
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--accent);
}
.game-sub { color: var(--muted); margin-top: 8px; font-size: 17px; }
.menu-scroll { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }
.menu-block h2 { font-size: 18px; color: var(--accent); margin-bottom: 12px; }
.theme-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.theme-card {
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}
.theme-card h3 { font-size: 19px; margin-bottom: 8px; }
.theme-scene { color: var(--muted); font-size: 13px; line-height: 1.6; min-height: 42px; }
.theme-best { margin-top: 10px; font-size: 13px; color: var(--accent); font-weight: 700; }
.theme-lock { margin-top: 10px; font-size: 13px; color: var(--danger); line-height: 1.5; }
.theme-card.selected { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-4px); }
.theme-card.locked { opacity: 0.62; cursor: not-allowed; }
.menu-hint { color: var(--muted); font-size: 13px; margin-top: 12px; }

.editor-entry {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: 20px 24px;
}
.editor-entry h2 { margin-bottom: 4px; }
.btn-wide { min-width: 200px; }

/* ========== 捏脸编辑器 ========== */
#screen-editor { overflow: auto; background: var(--bg); padding: 28px; }
.editor-wrap { max-width: 1100px; margin: 0 auto; }
.editor-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.editor-head h2 { color: var(--accent); font-size: 24px; }
.editor-body { display: grid; grid-template-columns: 300px 1fr; gap: 28px; }
.editor-preview {
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  height: fit-content;
}
#avatar-canvas { width: 260px; height: 260px; }
.preset-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.editor-controls { display: flex; flex-direction: column; gap: 18px; }
.edit-group {
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 16px 18px;
}
.edit-group h3 { font-size: 15px; color: var(--accent); margin-bottom: 10px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  padding: 8px 15px;
  border-radius: 999px;
  border: 1.5px solid var(--line);
  background: var(--panel);
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.chip.active { border-color: var(--accent); color: var(--accent); }
.chip.locked, .chip[data-locked='1'] { opacity: 0.55; cursor: not-allowed; }
.swatch-row { display: flex; flex-wrap: wrap; gap: 12px; }
.swatch {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid var(--line);
  background: var(--sw);
  cursor: pointer;
}
.swatch.active { border-color: var(--text); box-shadow: 0 0 0 3px var(--line); }
.btn-small { padding: 8px 16px; font-size: 14px; }

/* ========== 游戏画布与四区 HUD ========== */
#screen-game { background: #000; }
#game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud-layer { position: absolute; inset: 0; pointer-events: none; }
#hud-layer button, #hud-layer .shift-btn { pointer-events: auto; }

.hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 14px 22px;
  background: linear-gradient(rgba(0, 0, 0, 0.4), transparent);
  font-size: 15px;
}
.hud-left { display: flex; flex-direction: column; gap: 6px; }
.hud-line { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.hud-sub { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.hud-stage {
  padding: 3px 12px;
  border-radius: 999px;
  background: var(--accent);
  color: #102018;
  font-weight: 900;
  font-size: 13px;
}
.hud-hearts { font-size: 16px; letter-spacing: 1px; }
.hud-effects { display: flex; gap: 6px; flex-wrap: wrap; }
.effect-chip {
  font-size: 12px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--accent);
  background: rgba(0, 0, 0, 0.28);
}
.hud-right { display: flex; align-items: center; gap: 12px; }
.hud-forms { display: flex; gap: 8px; }
.form-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1.5px solid var(--form-color);
  color: var(--form-color);
  font-weight: 800;
  font-size: 13px;
  opacity: 0.42;
}
.form-glyph { font-style: normal; font-size: 15px; }
.form-chip.active { opacity: 1; }
.hud-item b { color: var(--accent); font-size: 16px; margin-left: 4px; }
.icon-btn {
  background: rgba(0, 0, 0, 0.32);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 15px;
  padding: 5px 10px;
  cursor: pointer;
}

.bottom-hint {
  position: absolute;
  bottom: 26px;
  left: 34px;
  color: var(--muted);
  font-size: 13px;
}
.bottom-hint b { color: var(--text); font-weight: 700; }

/* 阶段牌 */
.stage-banner {
  position: absolute;
  top: 22%;
  left: 50%;
  transform: translateX(-50%);
  background: var(--panel);
  border: 1.5px solid var(--accent);
  border-radius: 16px;
  padding: 16px 30px;
  text-align: center;
  box-shadow: var(--shadow);
  animation: banner-in 0.3s ease;
}
.stage-banner b { display: block; font-size: 26px; color: var(--accent); margin-bottom: 6px; }
.stage-banner span { color: var(--muted); font-size: 14px; }
@keyframes banner-in {
  from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* 触屏 SHIFT 大键 */
.shift-btn {
  position: absolute;
  right: 34px;
  bottom: 30px;
  width: 128px;
  height: 68px;
  border-radius: 14px;
  border: none;
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--accent);
  background: linear-gradient(#3a3f45, #262a2e);
  box-shadow: 0 6px 0 #16191c;
  cursor: pointer;
  touch-action: none;
}
.shift-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #16191c; }

/* Toast */
.toast {
  position: absolute;
  top: 70px;
  left: 50%;
  transform: translateX(-50%) translateY(-12px);
  padding: 9px 22px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.66);
  border: 1px solid var(--line);
  font-weight: 700;
  opacity: 0;
  transition: opacity 0.25s ease, transform 0.25s ease;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ========== 遮罩层通用 ========== */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  background: rgba(0, 0, 0, 0.55);
  padding: 24px;
}

/* ========== 10 秒里程奖励弹层 ========== */
#reward-overlay { background: rgba(0, 0, 0, 0.42); }
.decision-head { text-align: center; margin-bottom: 22px; }
.decision-head h2 { font-size: 29px; color: var(--accent); }
.decision-banter { color: var(--muted); margin-top: 8px; }
.decision-cards { display: flex; gap: 18px; max-width: 920px; }
.decision-card {
  width: 240px;
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: 22px 18px;
  text-align: center;
  transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.decision-card.selected {
  border-color: var(--accent);
  box-shadow: var(--shadow);
  transform: translateY(-8px) scale(1.04);
}
.decision-type {
  display: inline-block;
  font-size: 12px;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--accent);
  color: #102018;
  margin-bottom: 12px;
}
.decision-card h3 { font-size: 20px; margin-bottom: 10px; }
.decision-card p { color: var(--muted); font-size: 14px; line-height: 1.6; }
.decision-foot { display: flex; align-items: center; gap: 20px; margin-top: 26px; }
.decision-ring {
  width: 62px; height: 62px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: conic-gradient(var(--accent) var(--dec, 360deg), rgba(255, 255, 255, 0.12) 0);
  position: relative;
}
.decision-ring::before {
  content: '';
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  background: var(--panel);
}
.decision-ring span { position: relative; font-weight: 800; color: var(--accent); }

/* ========== 结算 ========== */
.result-card {
  width: min(640px, 100%);
  max-height: 92vh;
  overflow: auto;
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  padding: 30px 34px;
  text-align: center;
  box-shadow: var(--shadow);
}
.result-card h2 { color: var(--accent); font-size: 22px; margin-bottom: 14px; }
.score-big { font-size: 56px; font-weight: 900; color: var(--accent); }
.score-big small { font-size: 20px; margin-left: 4px; }
.result-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 20px 0;
}
.result-grid div {
  background: rgba(128, 128, 128, 0.12);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.result-grid span { color: var(--muted); font-size: 12px; }
.result-grid b { font-size: 17px; }
.unlock-box {
  border: 1.5px dashed var(--accent-2);
  border-radius: 12px;
  padding: 12px;
  color: var(--accent-2);
  font-weight: 800;
  margin-bottom: 18px;
}
.result-actions { display: flex; gap: 14px; }
.btn {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  border: 1.5px solid var(--accent);
  background: var(--accent);
  color: #102018;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}
.btn-ghost { background: transparent; color: var(--accent); }

/* ========== 暂停 ========== */
.pause-card {
  text-align: center;
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-radius: 18px;
  padding: 34px 46px;
}
.pause-card h2 { font-size: 28px; margin-bottom: 8px; }
.pause-card p { color: var(--muted); margin-bottom: 20px; }
.pause-card .btn { min-width: 180px; }

/* ========== 响应式 ========== */
@media (max-width: 900px) {
  .theme-cards { grid-template-columns: 1fr; }
  .editor-body { grid-template-columns: 1fr; }
  .decision-cards { flex-direction: column; }
  .decision-card { width: 100%; }
  .result-grid { grid-template-columns: repeat(2, 1fr); }
  .hud { gap: 10px; font-size: 13px; }
  .bottom-hint { display: none; }
}

  </style>
</head>

// ===== js/core/rng.js =====
// 确定性随机：玩法逻辑禁止直接用 Math.random，同一 seed 必须可复现（便于测试与回放）。
function mulberry32(seed) {
  let a = seed >>> 0;
  return function rng() {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function pick(rng, arr) {
  return arr[Math.floor(rng() * arr.length)];
}

// 无放回采样 n 个元素；n 超过数组长度时返回全量副本。
function sampleDistinct(rng, arr, n) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(rng() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, Math.min(n, copy.length));
}

// ===== js/core/forms.js =====
// ShiftStateMachine：冲刺 / 相位 / 重击三形态循环切换，带切换冷却。
// v3：形态色降饱和，配合整体低刺激视觉；冷却可被奖励缩短。
const FORM = {
  DASH: 'dash',
  PHASE: 'phase',
  SMASH: 'smash',
};

const FORM_ORDER = [FORM.DASH, FORM.PHASE, FORM.SMASH];

const FORM_META = {
  dash: { label: '冲刺', speedMul: 1.25, color: '#6fcf97', hint: '快速穿过冲刺门' },
  phase: { label: '相位', speedMul: 1.0, color: '#6fb8d9', hint: '虚化穿过裂隙墙' },
  smash: { label: '重击', speedMul: 0.85, color: '#e0995e', hint: '撞碎实体异常物' },
};

const SWITCH_COOLDOWN_MS = 180;
const REDUCED_COOLDOWN_MS = 110;

function createFormState(now = 0) {
  return { index: 0, form: FORM_ORDER[0], lastSwitchAt: -Infinity, switchedAt: now };
}

// 按一次 Shift 循环一档；冷却内忽略，返回是否切换成功。cooldownMs 由奖励动态决定。
function cycleForm(formState, now, cooldownMs = SWITCH_COOLDOWN_MS) {
  if (now - formState.lastSwitchAt < cooldownMs) return false;
  formState.index = (formState.index + 1) % FORM_ORDER.length;
  formState.form = FORM_ORDER[formState.index];
  formState.lastSwitchAt = now;
  formState.switchedAt = now;
  return true;
}

// 当前形态的实际速度倍率：形态基础倍率 × 路线/限时速度修正由 runstate 统一处理。
function formSpeedMul(form) {
  return FORM_META[form].speedMul;
}

// 相位容错：切入相位后的一段时间内碰撞免伤（时长由奖励提供，单位秒）。
function isPhaseGrace(formState, run, now) {
  if (formState.form !== FORM.PHASE || run.modifiers.phaseGrace <= 0) return false;
  return now - formState.switchedAt < run.modifiers.phaseGrace * 1000;
}

// 重击容错：重击范围扩大奖励后，切入重击的短窗口内错配免伤。
function isSmashGrace(formState, run, now) {
  if (formState.form !== FORM.SMASH || run.modifiers.smashGrace <= 0) return false;
  return now - formState.switchedAt < run.modifiers.smashGrace * 1000;
}

// ===== js/core/runstate.js =====
// 单局运行状态工厂与限时效果管理。v3：奖励以限时效果为主，难度按 Stage 台阶式晋升。

const BASE_SPEED = 260; // px/s
const MAX_SPEED = 640;
const MAX_HEARTS = 5;
const HIT_INVULN_MS = 1500;

function createRunState(theme, { seed = 1, now = 0, appearance = null } = {}) {
  return {
    themeId: theme.themeId,
    seed,
    appearance,
    formState: createFormState(now),
    hearts: 3,
    maxHearts: MAX_HEARTS,
    // 局内永久/累积型奖励状态
    modifiers: {
      shieldCharges: 0,
      deathSave: 0,
      phaseGrace: 0, // 秒
      smashGrace: 0, // 秒
      smashScoreMul: 0,
      dashCooldownReduce: false,
    },
    // 限时效果：{ key, value, expireAt（局内时钟 ms） }
    timedEffects: [],
    distance: 0, // 米
    obstacleScore: 0,
    combo: 0,
    bestCombo: 0,
    successCount: 0,
    hitCount: 0,
    rewardsTaken: 0,
    elapsedMs: 0,
    invulnUntil: 0,
    over: false,
    overReason: '',
  };
}

// 注册/刷新一个限时效果；同 key 以新效果替换（倍率不叠加，只刷新时长与数值）。
function putTimedEffect(run, key, value, durationMs, now) {
  run.timedEffects = run.timedEffects.filter((e) => e.key !== key);
  run.timedEffects.push({ key, value, expireAt: now + durationMs });
}

// 每帧清理过期效果，返回被清理的 key 列表（供 UI 撤下图标）。
function tickEffects(run, now) {
  const expired = run.timedEffects.filter((e) => now >= e.expireAt).map((e) => e.key);
  if (expired.length) run.timedEffects = run.timedEffects.filter((e) => now < e.expireAt);
  return expired;
}

function activeTimed(run, key, now) {
  const e = run.timedEffects.find((x) => x.key === key && now < x.expireAt);
  return e ? e.value : null;
}

function activeTimedEffects(run, now) {
  return run.timedEffects.filter((e) => now < e.expireAt);
}

// 基础移动速度：阶段台阶速度 × 限时速度修正，形态倍率由编排层另行相乘。
function currentSpeed(run, stageParams, now = run.elapsedMs) {
  let speed = BASE_SPEED * stageParams.speedMul;
  const mul = activeTimed(run, 'speedMul', now);
  if (mul != null) speed *= mul;
  return Math.min(MAX_SPEED, speed);
}

// 当前受伤无敌时长：基础值 + 坚韧皮肤奖励的延长量。
function invulnDurationMs(run, now) {
  const extra = activeTimed(run, 'invulnExtend', now);
  return HIT_INVULN_MS + (extra || 0);
}

function totalScore(run) {
  return run.obstacleScore + Math.floor(run.distance);
}

// ===== js/core/stage.js =====
// 阶段机纯函数：里程节点（300/700/1200，之后每 500m）与 Stage 1-4 + Loop 难度参数。
// 配置由 stages.json 注入，本文件不持有可变状态，保证同里程必然得到同阶段。

// 第 nodeIndex 个奖励节点的里程（nodeIndex 从 0 开始）。
function nodeDistanceAt(nodeIndex, cfg) {
  if (nodeIndex < cfg.nodeDistances.length) return cfg.nodeDistances[nodeIndex];
  const last = cfg.nodeDistances[cfg.nodeDistances.length - 1];
  const extra = nodeIndex - cfg.nodeDistances.length + 1;
  return last + extra * cfg.loopStep;
}

// 依据里程定位当前阶段与 Loop 层级（Stage 4 之后每 500m 为一级 Loop）。
function stageAtDistance(distance, cfg) {
  const stages = cfg.stages;
  let base = stages[0];
  for (const s of stages) {
    if (distance >= s.fromDistance) base = s;
    else break;
  }
  const lastStage = stages[stages.length - 1];
  let loopLevel = 0;
  if (base.index === lastStage.index && distance > lastStage.fromDistance) {
    loopLevel = Math.floor((distance - lastStage.fromDistance) / cfg.loopStep);
  }
  return { stageIndex: base.index, loopLevel, base };
}

// 合成当前生效的难度参数：Loop 层级在 Stage 4 基础上继续提速、加密，间隔有地板。
function resolveStage(distance, cfg) {
  const { stageIndex, loopLevel, base } = stageAtDistance(distance, cfg);
  const speedMul = Math.min(
    2.4,
    base.speedMul * (loopLevel > 0 ? cfg.loopSpeedGrowth ** loopLevel : 1),
  );
  const spawnIntervalMs = Math.max(
    cfg.loopSpawnFloorMs,
    base.spawnIntervalMs - (loopLevel > 0 ? loopLevel * 40 : 0),
  );
  return {
    stageIndex,
    loopLevel,
    rule: base.rule,
    speedMul,
    spawnIntervalMs,
    maxGroup: base.maxGroup,
    comboChance: base.comboChance,
    fakeHint: base.fakeHint,
  };
}

// 跨越节点后返回新阶段的展示信息（阶段牌用）。
function stageBanner(distance, cfg) {
  const s = resolveStage(distance, cfg);
  const label = s.loopLevel > 0 ? `Stage 4+${s.loopLevel}` : `Stage ${s.stageIndex}`;
  return { label, rule: s.rule };
}

// ===== js/core/collision.js =====
// 碰撞结算纯函数：形态匹配则通过，否则按 无敌帧/容错 → 护盾 → 免死 → 掉心 顺序处理。


const RESULT = {
  PASS: 'pass', // 形态正确，成功通过
  GRACE: 'grace', // 无敌帧或容错窗口内，免伤通过
  SHIELD: 'shield', // 护盾抵消
  DEATH_SAVE: 'death_save', // 致命一击被免死次数接住
  HIT: 'hit', // 掉心
};

function comboMultiplier(run) {
  return 1 + Math.min(run.combo, 20) * 0.1;
}

// 成功通过障碍的得分：基础分 × 连击倍率 × 限时分数倍率 × 重击强化。
function successGain(obstacle, run, now) {
  let gain = obstacle.score * comboMultiplier(run);
  const scoreMul = activeTimed(run, 'scoreMul', now);
  if (scoreMul != null) gain *= scoreMul;
  if (run.formState.form === FORM.SMASH) gain *= 1 + run.modifiers.smashScoreMul;
  return Math.round(gain);
}

// 切换容错奖励：任意形态切换后的短窗口内错配免伤。
function isSwitchGrace(run, now) {
  const graceSec = activeTimed(run, 'switchGrace', now);
  if (graceSec == null) return false;
  return now - run.formState.switchedAt < graceSec * 1000;
}

// 结算一次碰撞，原地更新 run，返回结果类型与得分变化。
function resolveCollision(obstacle, run, now) {
  // 形态正确
  if (obstacle.needState === run.formState.form) {
    const gain = successGain(obstacle, run, now);
    run.obstacleScore += gain;
    run.combo += 1;
    run.bestCombo = Math.max(run.bestCombo, run.combo);
    run.successCount += 1;
    return { result: RESULT.PASS, gain };
  }
  // 无敌帧 / 相位容错 / 重击容错 / 通用切换容错
  if (
    now < run.invulnUntil
    || isPhaseGrace(run.formState, run, now)
    || isSmashGrace(run.formState, run, now)
    || isSwitchGrace(run, now)
  ) {
    return { result: RESULT.GRACE, gain: 0 };
  }
  // 护盾优先抵消任意错配
  if (run.modifiers.shieldCharges > 0) {
    run.modifiers.shieldCharges -= 1;
    run.invulnUntil = now + 800;
    return { result: RESULT.SHIELD, gain: 0 };
  }
  // 致命一击且持有免死：保留 1 颗心并给 2 秒无敌
  if (run.hearts - 1 <= 0 && run.modifiers.deathSave > 0) {
    run.modifiers.deathSave -= 1;
    run.hearts = 1;
    run.hitCount += 1;
    run.combo = 0;
    run.invulnUntil = now + 2000;
    return { result: RESULT.DEATH_SAVE, gain: 0 };
  }
  // 硬吃伤害
  run.hearts -= 1;
  run.hitCount += 1;
  run.combo = 0;
  run.invulnUntil = now + invulnDurationMs(run, now);
  if (run.hearts <= 0) {
    run.hearts = 0;
    run.over = true;
    run.overReason = 'hearts_depleted';
  }
  return { result: RESULT.HIT, gain: 0 };
}

// ===== js/core/spawner.js =====
// EventSpawner：按 Stage 参数生成单/双/三障碍组合，并在高阶阶段标记假提示门。
// 时间与随机数均由外部注入，保持纯函数可测、同 seed 可复现。



// 生成间隔：阶段基础间隔 × 稀疏奖励系数，再叠加 ±15% 抖动。
function nextSpawnIntervalMs(stage, rng, run, now) {
  const sparseMul = activeTimed(run, 'spawnMul', now);
  const base = stage.spawnIntervalMs * (sparseMul || 1);
  const jitter = 0.85 + rng() * 0.3;
  return base * jitter;
}

// 本组障碍数量：Stage 1 恒为 1，其余阶段按 comboChance 出组合，Stage 4 可出三连。
function groupSize(rng, stage) {
  if (stage.maxGroup <= 1) return 1;
  if (rng() >= stage.comboChance) return 1;
  if (stage.maxGroup >= 3 && rng() < 0.35) return 3;
  return 2;
}

// 生成一组障碍（不含坐标，坐标由编排层按最小间距排布）。
// 组内优先抽取不同 needState，保证玩家能逐个切形态通过，而不是死局。
function spawnGroup(rng, pool, stage) {
  const n = groupSize(rng, stage);
  const chosen = [];
  const usedStates = new Set();
  let guard = 0;
  while (chosen.length < n && guard < 12) {
    const cand = pick(rng, pool);
    if (!usedStates.has(cand.needState)) {
      chosen.push({ ...cand });
      usedStates.add(cand.needState);
    }
    guard += 1;
  }
  while (chosen.length < n) chosen.push({ ...pick(rng, pool) });

  // 假提示：标注一个不存在的形态，真实形态仍以 needState 为准，渲染层据此画虚标。
  if (stage.fakeHint && rng() < 0.25) {
    const idx = Math.floor(rng() * chosen.length);
    const real = chosen[idx].needState;
    const others = FORM_ORDER.filter((f) => f !== real);
    chosen[idx].fakeHint = true;
    chosen[idx].fakeState = others[Math.floor(rng() * others.length)];
  }
  return chosen;
}

// 相邻障碍最小水平间距：保证按当前速度至少有 0.85s 反应时间。
function minGapPx(speed) {
  return speed * 0.85;
}

// ===== js/core/rewards.js =====
// 里程奖励纯逻辑：固定节点三选一与 Loop 随机三选一，效果由本注册表统一解释。
// JSON 只描述 effect，限时效果落 run.timedEffects，永久/累积效果落 run.modifiers。


function applyEffect(run, e, now) {
  switch (e.kind) {
    case 'timed':
      putTimedEffect(run, e.key, e.value, e.durationMs, now);
      return true;
    case 'flag':
      if (run.modifiers[e.key]) return false;
      run.modifiers[e.key] = true;
      return true;
    case 'modifier': {
      const cur = run.modifiers[e.key] || 0;
      if (e.maxStacks != null && cur / e.value >= e.maxStacks) return false;
      run.modifiers[e.key] = cur + e.value;
      return true;
    }
    default:
      return false;
  }
}

// 应用一张奖励卡；主效果被满级拦截时不计次数，附带效果仍独立结算。
function applyReward(run, reward, now = 0) {
  const e = reward.effect;
  let ok = applyEffect(run, e, now);
  if (e.also) for (const a of e.also) ok = applyEffect(run, a, now) || ok;
  if (ok) run.rewardsTaken += 1;
  return ok;
}

// Loop 随机池过滤：flag 已生效、modifier 已满级的奖励不再出现；限时效果总可刷新。
function availableRewards(allRewards, run) {
  return allRewards.filter((r) => {
    const e = r.effect;
    if (e.kind === 'flag') return !run.modifiers[e.key];
    if (e.kind === 'modifier' && e.maxStacks != null) {
      return (run.modifiers[e.key] || 0) / e.value < e.maxStacks;
    }
    return true;
  });
}

// 固定节点（300/700/1200m）：按 stages.nodeRewards 配置原样发三张。
function rollNodeRewards(nodeIndex, allRewards, cfg) {
  const ids = cfg.nodeRewards[nodeIndex];
  return ids.map((id) => allRewards.find((r) => r.id === id)).filter(Boolean);
}

// Loop+：保证 1 个高分、1 个稳健（保命/舒适）、1 个形态强化；某组耗尽则从余池补。
function rollLoopRewards(rng, allRewards, run) {
  const pool = availableRewards(allRewards, run);
  const groups = {
    score: pool.filter((r) => r.category === 'score'),
    steady: pool.filter((r) => r.category === 'survivor' || r.category === 'comfort'),
    form: pool.filter((r) => r.category === 'form'),
  };
  const picked = [];
  for (const key of ['score', 'steady', 'form']) {
    if (groups[key].length) picked.push(pick(rng, groups[key]));
  }
  if (picked.length < 3) {
    const rest = pool.filter((r) => !picked.includes(r));
    picked.push(...sampleDistinct(rng, rest, 3 - picked.length));
  }
  return picked.slice(0, 3);
}

function cycleOptionIndex(index, len) {
  if (len <= 0) return 0;
  return (index + 1) % len;
}

// 10 秒不操作：自动确认当前高亮项（文档 2.1 兜底规则）。
function autoSelect(options, highlightedIndex) {
  return options[Math.min(highlightedIndex, options.length - 1)];
}

// ===== js/core/meta.js =====
// MetaProgression：主题解锁链 + 捏脸配件/预设解锁 + 外观持久化。存储接口可注入，单测用内存实现。
const KEY = 'stb3_meta_v1';

const PART_TYPES = ['faces', 'eyes', 'mouths', 'hairs', 'outfits', 'charms'];

function defaultAppearance() {
  return {
    face: 'round',
    eyes: 'bean',
    mouth: 'smile',
    hair: 'ahoge',
    outfit: 'hoodie',
    mainColor: 'charcoal',
    accentColor: 'mint',
    charm: 'none',
  };
}

function emptyMeta() {
  return {
    runsCount: 0,
    totalDistance: 0,
    best: {}, // themeId -> { score, distance }
    unlocked: { themes: ['prod_incident'], parts: [], presets: ['programmer'] },
    appearance: defaultAppearance(),
  };
}

// 初始即可用的配件：无解锁条件的部件 + 全部颜色；预设取零局数解锁项。
function initialUnlocked(partsCfg) {
  const parts = [];
  for (const type of PART_TYPES) {
    for (const item of partsCfg[type]) if (!item.unlock) parts.push(item.id);
  }
  for (const c of partsCfg.mainColors) parts.push(c.id);
  for (const c of partsCfg.accentColors) parts.push(c.id);
  return {
    parts: [...new Set(parts)],
    presets: partsCfg.presets.filter((p) => p.unlockRuns === 0).map((p) => p.id),
  };
}

// 启动时确保新玩家存档包含默认可用配件，避免首局前编辑器全锁定。
function initMeta(storage, partsCfg) {
  if (storage.getItem(KEY)) return loadMeta(storage);
  const meta = emptyMeta();
  const init = initialUnlocked(partsCfg);
  meta.unlocked.parts = init.parts;
  meta.unlocked.presets = init.presets;
  saveMeta(storage, meta);
  return meta;
}

function loadMeta(storage) {
  try {
    const raw = storage.getItem(KEY);
    if (!raw) return emptyMeta();
    const merged = { ...emptyMeta(), ...JSON.parse(raw) };
    merged.unlocked = { ...emptyMeta().unlocked, ...(JSON.parse(raw).unlocked || {}) };
    merged.appearance = { ...defaultAppearance(), ...(JSON.parse(raw).appearance || {}) };
    return merged;
  } catch {
    return emptyMeta();
  }
}

function saveMeta(storage, meta) {
  storage.setItem(KEY, JSON.stringify(meta));
}

// 主题解锁：前一主题的最远距离达到本主题 unlock.distance。
function themeUnlockState(meta, themes) {
  const state = {};
  themes.forEach((theme, i) => {
    if (i === 0) {
      state[theme.themeId] = { unlocked: true };
      return;
    }
    const prevId = themes[i - 1].themeId;
    const prevBest = meta.best[prevId]?.distance ?? 0;
    const need = theme.unlock.distance;
    state[theme.themeId] = { unlocked: prevBest >= need, need, prevBest, prevId };
  });
  return state;
}

function partUnlockedByRule(rule, meta) {
  if (!rule) return true;
  if (rule.runs != null && meta.runsCount >= rule.runs) return true;
  if (rule.distance != null && meta.totalDistance >= rule.distance) return true;
  return false;
}

// 评估全部配件与预设的解锁状态（颜色不设解锁条件，始终可用）。
function evaluateUnlocks(meta, themes, partsCfg) {
  const tState = themeUnlockState(meta, themes);
  meta.unlocked.themes = themes.filter((t) => tState[t.themeId].unlocked).map((t) => t.themeId);

  const parts = [];
  for (const type of PART_TYPES) {
    for (const item of partsCfg[type]) {
      if (partUnlockedByRule(item.unlock, meta)) parts.push(item.id);
    }
  }
  for (const c of partsCfg.mainColors) parts.push(c.id);
  for (const c of partsCfg.accentColors) parts.push(c.id);
  meta.unlocked.parts = [...new Set(parts)];

  meta.unlocked.presets = partsCfg.presets
    .filter((p) => meta.runsCount >= p.unlockRuns)
    .map((p) => p.id);
}

// 一局结束后落盘：更新统计、最高分与解锁，返回新获得的解锁项供结算页展示。
function recordRun(storage, themes, partsCfg, run, score) {
  const meta = loadMeta(storage);
  meta.runsCount += 1;
  meta.totalDistance += Math.floor(run.distance);

  const prev = meta.best[run.themeId] || { score: 0, distance: 0 };
  meta.best[run.themeId] = {
    score: Math.max(prev.score, score),
    distance: Math.max(prev.distance, Math.floor(run.distance)),
  };

  const before = {
    themes: [...meta.unlocked.themes],
    parts: [...meta.unlocked.parts],
    presets: [...meta.unlocked.presets],
  };
  evaluateUnlocks(meta, themes, partsCfg);
  const newly = {
    themes: meta.unlocked.themes.filter((x) => !before.themes.includes(x)),
    parts: meta.unlocked.parts.filter((x) => !before.parts.includes(x)),
    presets: meta.unlocked.presets.filter((x) => !before.presets.includes(x)),
  };
  saveMeta(storage, meta);
  return { meta, newly };
}

function isPartUnlocked(meta, partId) {
  return meta.unlocked.parts.includes(partId);
}

// 保存整套外观；未解锁配件拒绝写入，返回是否成功。
function saveAppearance(storage, appearance) {
  const meta = loadMeta(storage);
  const next = { ...meta.appearance, ...appearance };
  const values = Object.values(next);
  if (!values.every((id) => id === 'none' || meta.unlocked.parts.includes(id))) return false;
  meta.appearance = next;
  saveMeta(storage, meta);
  return true;
}

// 一键应用预设套装；预设未解锁时拒绝。
function applyPreset(storage, partsCfg, presetId) {
  const meta = loadMeta(storage);
  const preset = partsCfg.presets.find((p) => p.id === presetId);
  if (!preset || !meta.unlocked.presets.includes(presetId)) return false;
  meta.appearance = { ...preset.appearance };
  saveMeta(storage, meta);
  return true;
}

// ===== js/render/character.js =====
// 程序化 Q 版捏脸主角：脸型/眼睛/嘴巴/发型/衣服/双色/挂件七个部件自由组合。
// 全部 Canvas 矢量绘制，不依赖图片资源；外观数据由 meta.appearance 提供，颜色 hex 由编排层映射注入。

const SKIN_TONE = '#ffd9b3';
const HAIR_TONE = '#4a3f38';

function circle(ctx, x, y, r, fill) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = fill;
  ctx.fill();
}

function roundRect(ctx, x, y, w, h, r, fill) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
}

// ---------------- 脸型 ----------------
function drawFaceShape(ctx, headY, face) {
  ctx.fillStyle = SKIN_TONE;
  if (face === 'square') {
    roundRect(ctx, -19, headY - 19, 38, 37, 11, SKIN_TONE);
  } else if (face === 'sharp') {
    ctx.beginPath();
    ctx.arc(0, headY - 2, 19, Math.PI, 0);
    ctx.lineTo(0, headY + 20);
    ctx.closePath();
    ctx.fill();
  } else {
    circle(ctx, 0, headY, 20, SKIN_TONE);
  }
}

// ---------------- 眼睛（expression 可临时覆盖）----------------
function drawEyes(ctx, headY, eye, expression) {
  const y = headY - 1;
  ctx.fillStyle = '#2b2622';
  ctx.strokeStyle = '#2b2622';
  if (expression === 'hurt') {
    ctx.lineWidth = 2;
    for (const sx of [-7, 7]) {
      ctx.beginPath();
      ctx.moveTo(sx - 2.6, y - 2.6); ctx.lineTo(sx + 2.6, y + 2.6);
      ctx.moveTo(sx + 2.6, y - 2.6); ctx.lineTo(sx - 2.6, y + 2.6);
      ctx.stroke();
    }
    return;
  }
  if (expression === 'happy' || eye === 'star') {
    const color = eye === 'star' ? '#e8c86a' : '#2b2622';
    ctx.fillStyle = color;
    for (const sx of [-7, 7]) {
      ctx.beginPath();
      ctx.arc(sx, y, 3.6, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }
    if (eye === 'star') {
      for (const sx of [-7, 7]) {
        ctx.beginPath();
        ctx.moveTo(sx, y - 5); ctx.lineTo(sx + 1.6, y - 1.6); ctx.lineTo(sx + 5, y - 1);
        ctx.lineTo(sx + 1.6, y + 1.2); ctx.lineTo(sx + 3, y + 4.6); ctx.lineTo(sx, y + 2.4);
        ctx.lineTo(sx - 3, y + 4.6); ctx.lineTo(sx - 1.6, y + 1.2); ctx.lineTo(sx - 5, y - 1);
        ctx.lineTo(sx - 1.6, y - 1.6);
        ctx.closePath();
        ctx.fill();
      }
    }
    return;
  }
  if (eye === 'sleepy') {
    ctx.lineWidth = 1.8;
    for (const sx of [-7, 7]) {
      ctx.beginPath();
      ctx.arc(sx, y - 1, 3.4, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }
    return;
  }
  if (eye === 'sharp') {
    for (const sx of [-7, 7]) {
      ctx.beginPath();
      ctx.moveTo(sx - 3.4, y + 1.4);
      ctx.lineTo(sx + 3.4, y - 2.2);
      ctx.lineTo(sx + 3.4, y + 1.4);
      ctx.closePath();
      ctx.fill();
    }
    return;
  }
  // bean 豆豆眼
  circle(ctx, -7, y, 3.4, '#2b2622');
  circle(ctx, 7, y, 3.4, '#2b2622');
  circle(ctx, -6, y - 1, 1.1, '#fff');
  circle(ctx, 8, y - 1, 1.1, '#fff');
}

// ---------------- 嘴巴 ----------------
function drawMouth(ctx, headY, mouth, expression) {
  const y = headY + 7;
  ctx.strokeStyle = '#a35d4b';
  ctx.fillStyle = '#a35d4b';
  ctx.lineWidth = 1.6;
  const effective = expression === 'hurt' ? 'open' : expression === 'happy' ? 'smile' : mouth;
  if (effective === 'open') {
    circle(ctx, 0, y + 1, 3, '#9c4f41');
  } else if (effective === 'flat') {
    ctx.beginPath();
    ctx.moveTo(-4, y); ctx.lineTo(4, y);
    ctx.stroke();
  } else if (effective === 'cat') {
    ctx.beginPath();
    ctx.arc(-2.4, y, 2.4, 0.15 * Math.PI, 0.9 * Math.PI);
    ctx.arc(2.4, y, 2.4, 0.1 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(0, y - 1, 3.5, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  }
}

// ---------------- 发型 ----------------
function drawHair(ctx, headY, hair, accent) {
  ctx.fillStyle = HAIR_TONE;
  ctx.strokeStyle = HAIR_TONE;
  if (hair === 'buns') {
    circle(ctx, -17, headY - 17, 7, HAIR_TONE);
    circle(ctx, 17, headY - 17, 7, HAIR_TONE);
  }
  if (hair === 'cap') {
    // 鸭舌帽：帽身用强调色，帽檐朝前
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(0, headY - 5, 19, Math.PI, Math.PI * 2);
    ctx.fill();
    roundRect(ctx, -20, headY - 9, 40, 6, 3, accent);
    roundRect(ctx, 2, headY - 8, 22, 5, 2, accent);
    return;
  }
  ctx.beginPath();
  ctx.arc(0, headY - 4, 20, Math.PI, Math.PI * 2);
  ctx.fill();
  if (hair === 'ahoge') {
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, headY - 22);
    ctx.quadraticCurveTo(6, headY - 30, 2, headY - 34);
    ctx.stroke();
  }
}

// ---------------- 衣服 ----------------
function drawOutfit(ctx, bodyY, outfit, colors) {
  const { main, accent } = colors;
  if (outfit === 'badge') {
    roundRect(ctx, -17, bodyY - 4, 34, 30, 8, main);
    roundRect(ctx, -17, bodyY + 12, 34, 14, 8, shade(main));
    roundRect(ctx, -6, bodyY + 2, 12, 9, 2, '#f4f1e8'); // 工牌卡
    ctx.fillStyle = accent;
    ctx.fillRect(-4, bodyY + 5, 8, 2);
  } else if (outfit === 'apron') {
    roundRect(ctx, -17, bodyY - 4, 34, 30, 8, shade(main));
    roundRect(ctx, -13, bodyY - 2, 26, 28, 6, main); // 围裙面
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-10, bodyY - 2); ctx.lineTo(-6, bodyY - 10);
    ctx.moveTo(10, bodyY - 2); ctx.lineTo(6, bodyY - 10);
    ctx.stroke();
  } else if (outfit === 'cape') {
    // 斗篷在身后，先画
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.moveTo(-14, bodyY - 8);
    ctx.quadraticCurveTo(-26, bodyY + 18, -20, bodyY + 28);
    ctx.lineTo(20, bodyY + 28);
    ctx.quadraticCurveTo(26, bodyY + 18, 14, bodyY - 8);
    ctx.closePath();
    ctx.fill();
    roundRect(ctx, -17, bodyY - 4, 34, 30, 10, main);
  } else {
    // hoodie 卫衣
    circle(ctx, 0, bodyY - 8, 11, shade(main)); // 兜帽
    roundRect(ctx, -17, bodyY - 4, 34, 30, 10, main);
    roundRect(ctx, -17, bodyY + 12, 34, 14, 8, shade(main));
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, bodyY + 14); ctx.lineTo(8, bodyY + 14);
    ctx.stroke();
  }
}

// 简单压暗：用于衣服阴影区
function shade(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, ((n >> 16) & 255) - 34);
  const g = Math.max(0, ((n >> 8) & 255) - 34);
  const b = Math.max(0, (n & 255) - 34);
  return `rgb(${r},${g},${b})`;
}

// ---------------- 挂件 ----------------
function drawCharm(ctx, bodyY, charm, colors) {
  if (charm === 'none') return;
  if (charm === 'badge') {
    roundRect(ctx, 9, bodyY + 2, 9, 12, 2, '#f4f1e8');
    ctx.fillStyle = colors.accent;
    ctx.fillRect(11, bodyY + 5, 5, 2);
  } else if (charm === 'scanner') {
    roundRect(ctx, 16, bodyY - 2, 12, 7, 2, '#3a3f45');
    circle(ctx, 27, bodyY + 1, 2.4, colors.accent);
  } else if (charm === 'hamster') {
    circle(ctx, -15, bodyY - 8, 6, '#d8cfc0');
    circle(ctx, -19, bodyY - 13, 2.6, '#d8cfc0');
    circle(ctx, -11, bodyY - 13, 2.6, '#d8cfc0');
    circle(ctx, -16.5, bodyY - 9, 1, '#5b5147');
    circle(ctx, -13.5, bodyY - 9, 1, '#5b5147');
  } else if (charm === 'toast') {
    ctx.fillStyle = '#e3b877';
    ctx.beginPath();
    ctx.moveTo(-20, bodyY + 2);
    ctx.lineTo(-28, bodyY + 16);
    ctx.lineTo(-14, bodyY + 16);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#c98f4f';
    ctx.fillRect(-25, bodyY + 9, 8, 3);
  }
}

// 头部组合件（奔跑角色与编辑器预览共用）。
function drawHead(ctx, headY, appearance, colors, expression) {
  drawFaceShape(ctx, headY, appearance.face);
  // 腮红
  circle(ctx, -12, headY + 6, 2.6, 'rgba(224,138,120,0.35)');
  circle(ctx, 12, headY + 6, 2.6, 'rgba(224,138,120,0.35)');
  drawEyes(ctx, headY, appearance.eyes, expression);
  drawMouth(ctx, headY, appearance.mouth, expression);
  drawHair(ctx, headY, appearance.hair, colors.accent);
}

// opts: { appearance, colors:{main,accent}, form, runPhase, invuln, now, expression }
function drawCharacter(ctx, x, groundY, opts) {
  const { appearance, colors, form, runPhase, invuln, now, expression = 'normal' } = opts;
  const formColor = FORM_META[form].color;

  ctx.save();
  if (invuln && Math.floor(now / 120) % 2 === 0) ctx.globalAlpha = 0.4;
  if (form === 'phase') ctx.globalAlpha *= 0.68;

  const lean = form === 'dash' ? 0.2 : form === 'smash' ? -0.05 : 0;
  const bob = Math.sin(runPhase * Math.PI * 2) * (form === 'smash' ? 1.4 : 2.6);
  ctx.translate(x, groundY + bob);
  ctx.rotate(lean);

  // 形态特效（降刺激：残影减到 2 个、透明度更低）
  if (form === 'dash') {
    for (let i = 1; i <= 2; i += 1) {
      ctx.fillStyle = `rgba(111,207,151,${0.08 / i})`;
      roundRect(ctx, -22 - i * 13, -46, 28, 44, 10, ctx.fillStyle);
    }
  }
  if (form === 'phase') {
    ctx.strokeStyle = 'rgba(111,184,217,0.42)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(0, -34, 25 + Math.sin(now / 140) * 2.4, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 腿
  const legSwing = Math.sin(runPhase * Math.PI * 2) * 8;
  ctx.strokeStyle = '#34302c';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-6, -10); ctx.lineTo(-6 - legSwing, 0);
  ctx.moveTo(6, -10); ctx.lineTo(6 + legSwing, 0);
  ctx.stroke();

  // 身体 + 挂件
  drawOutfit(ctx, -34, appearance.outfit, colors);
  drawCharm(ctx, -34, appearance.charm, colors);

  // 手臂（重击前置拳套）
  ctx.lineWidth = 5;
  ctx.strokeStyle = shade(colors.main);
  if (form === 'smash') {
    ctx.beginPath();
    ctx.moveTo(0, -30); ctx.lineTo(20, -20);
    ctx.stroke();
    circle(ctx, 25, -18, 7, formColor);
  } else if (form === 'dash') {
    ctx.beginPath();
    ctx.moveTo(0, -30); ctx.lineTo(-16, -24 + legSwing * 0.5);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(0, -30); ctx.lineTo(-14, -22);
    ctx.stroke();
  }

  // 头
  drawHead(ctx, -52, appearance, colors, expression);

  // 形态头饰
  if (form === 'dash') {
    ctx.fillStyle = formColor;
    roundRect(ctx, -19, -60, 38, 5.5, 3, formColor);
  } else if (form === 'phase') {
    ctx.strokeStyle = formColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -52, 23, -0.4, 1.2);
    ctx.stroke();
  } else {
    ctx.fillStyle = formColor;
    roundRect(ctx, -18, -62, 36, 6.5, 3, formColor);
  }

  ctx.restore();

  // 落地阴影
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(x, groundY + 3, 22, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// 编辑器/结算头像预览：只画肩以上，居中于 (cx, cy)，scale 控制大小。
function drawPortrait(ctx, cx, cy, scale, appearance, colors, expression = 'normal') {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  drawOutfit(ctx, 6, appearance.outfit, colors);
  drawHead(ctx, -24, appearance, colors, expression);
  ctx.restore();
}

// 外观颜色 id → 实际 hex：游戏内角色与编辑器预览共用同一映射，避免两处色差。
function resolveColors(partsCfg, appearance) {
  const main = partsCfg.mainColors.find((c) => c.id === appearance.mainColor);
  const accent = partsCfg.accentColors.find((c) => c.id === appearance.accentColor);
  return {
    main: main ? main.hex : '#6b7280',
    accent: accent ? accent.hex : '#8fd8b0',
  };
}

// ===== js/render/renderer.js =====
// Canvas 渲染器（v3 低刺激版）：背景只做远景剪影与氛围，障碍与角色保持最高可读性。
// 危险色只给障碍门；粒子/抖屏弱化；所有玩法状态由 RunScene 传入，本类只绘制。


const STATE_GLYPH = { dash: '»', phase: '◌', smash: '✊' };

class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.w = 0;
    this.h = 0;
    this.dpr = 1;
    this.layerOffset = [0, 0, 0];
    this.resize();
    window.addEventListener('resize', () => this.resize());
  }

  resize() {
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.w = this.canvas.clientWidth;
    this.h = this.canvas.clientHeight;
    this.canvas.width = Math.floor(this.w * this.dpr);
    this.canvas.height = Math.floor(this.h * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.groundY = this.h - 110;
    this.playerX = Math.max(120, this.w * 0.22);
  }

  // 视差减速：远景明显慢于前景，避免眩晕（文档 4.1）。
  scroll(deltaPx) {
    this.layerOffset[0] += deltaPx * 0.12;
    this.layerOffset[1] += deltaPx * 0.3;
    this.layerOffset[2] += deltaPx * 0.5;
  }

  render(frame) {
    const { ctx, w, h } = this;
    const { theme, run, obstacles, particles, floatTexts, now, appearance, colors, invuln, shake, expression } = frame;
    const pal = theme.palette;
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 0.5, (Math.random() - 0.5) * shake * 0.5);
    this._drawBackground(theme, pal);
    this._drawGround(pal);
    this._drawObstacles(obstacles, pal);
    drawCharacter(ctx, this.playerX, this.groundY, {
      appearance, colors, form: run.formState.form,
      runPhase: (run.elapsedMs / 260) % 1, invuln, now, expression,
    });
    this._drawParticles(particles);
    this._drawFloatTexts(floatTexts);
    ctx.restore();
  }

  _drawBackground(theme, pal) {
    const { ctx, w, h } = this;
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, pal.bg1);
    grad.addColorStop(1, pal.bg0);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    theme.world.bgLayers.forEach((layerId, i) => {
      this._drawLayer(layerId, pal, this.layerOffset[i], 0.1 + i * 0.08, i);
    });
  }

  // 远景一律剪影/柔化，不出现可交互物件的描边与高亮。
  _drawLayer(layerId, pal, offset, alpha, depth) {
    const { ctx, w, groundY } = this;
    ctx.save();
    ctx.globalAlpha = alpha;
    const gap = 300;
    const shift = -(offset % gap);
    for (let x = shift - gap; x < w + gap; x += gap) {
      switch (layerId) {
        case 'server_rack': {
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          ctx.roundRect(x, groundY - 220, 150, 220, 8);
          ctx.fill();
          ctx.fillStyle = pal.primary;
          ctx.globalAlpha = alpha * 0.5;
          for (let r = 0; r < 4; r += 1) ctx.fillRect(x + 18, groundY - 200 + r * 44, 26, 5);
          ctx.globalAlpha = alpha;
          break;
        }
        case 'error_rain': {
          ctx.fillStyle = pal.primary;
          ctx.font = '12px monospace';
          ctx.globalAlpha = alpha * 0.7;
          ctx.fillText('500', x + 40, groundY - 170 - ((offset / 4) % 240));
          ctx.globalAlpha = alpha;
          break;
        }
        case 'alert_light': {
          ctx.fillStyle = pal.danger;
          ctx.globalAlpha = alpha * 0.45;
          ctx.beginPath();
          ctx.arc(x + 70, groundY - 235, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = alpha;
          break;
        }
        case 'shelf': {
          ctx.fillStyle = 'rgba(90,70,45,0.35)';
          ctx.fillRect(x, groundY - 210, 180, 12);
          ctx.fillRect(x, groundY - 140, 180, 12);
          ctx.fillRect(x, groundY - 210, 10, 210);
          break;
        }
        case 'fridge': {
          ctx.fillStyle = 'rgba(255,255,255,0.28)';
          ctx.roundRect(x, groundY - 235, 120, 235, 10);
          ctx.fill();
          ctx.fillStyle = pal.primary;
          ctx.globalAlpha = alpha * 0.6;
          ctx.fillRect(x + 12, groundY - 225, 96, 6);
          ctx.globalAlpha = alpha;
          break;
        }
        case 'night_lamp': {
          ctx.fillStyle = pal.primary;
          ctx.globalAlpha = alpha * 0.4;
          ctx.beginPath();
          ctx.moveTo(x + 40, groundY - 250);
          ctx.lineTo(x - 20, groundY - 120);
          ctx.lineTo(x + 100, groundY - 120);
          ctx.closePath();
          ctx.fill();
          ctx.globalAlpha = alpha;
          break;
        }
        case 'kitchen': {
          ctx.fillStyle = 'rgba(0,0,0,0.32)';
          ctx.roundRect(x, groundY - 175, 180, 175, 10);
          ctx.fill();
          break;
        }
        case 'rift': {
          ctx.strokeStyle = pal.danger;
          ctx.lineWidth = 1.4;
          ctx.globalAlpha = alpha * 0.8;
          ctx.beginPath();
          ctx.moveTo(x + 30, groundY - 250);
          ctx.quadraticCurveTo(x + 70, groundY - 170, x + 20, groundY - 80);
          ctx.stroke();
          ctx.globalAlpha = alpha;
          break;
        }
        case 'shrine': {
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          ctx.fillRect(x + 20, groundY - 230, 16, 230);
          ctx.fillRect(x + 92, groundY - 230, 16, 230);
          ctx.beginPath();
          ctx.arc(x + 64, groundY - 230, 50, Math.PI, 0);
          ctx.fill();
          break;
        }
        default:
          break;
      }
    }
    ctx.restore();
  }

  _drawGround(pal) {
    const { ctx, w, groundY, h } = this;
    ctx.fillStyle = pal.ground;
    ctx.fillRect(0, groundY, w, h - groundY);
    ctx.strokeStyle = pal.primary;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(w, groundY);
    ctx.stroke();
    ctx.globalAlpha = 0.14;
    for (let x = -(this.layerOffset[2] % 96); x < w; x += 96) {
      ctx.beginPath();
      ctx.moveTo(x, groundY + 34);
      ctx.lineTo(x + 38, groundY + 34);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  _drawObstacles(obstacles, pal) {
    const { ctx, groundY } = this;
    for (const ob of obstacles) {
      const realColor = FORM_META[ob.needState].color;
      const shownForm = ob.fakeHint ? ob.fakeState : ob.needState;
      const x = ob.x;
      const y = groundY - 4;
      const matched = ob.needState === ob.currentForm;
      ctx.save();
      ctx.globalAlpha = ob.resolved ? 0.22 : 1;
      // 门体颜色永远表达真实形态；假提示门用虚线边框提示“标注有诈”
      ctx.fillStyle = 'rgba(12,14,18,0.85)';
      ctx.strokeStyle = realColor;
      ctx.lineWidth = matched ? 3.5 : 2;
      ctx.setLineDash(ob.fakeHint ? [6, 5] : []);
      ctx.shadowColor = realColor;
      ctx.shadowBlur = matched ? 10 : 4;
      ctx.beginPath();
      ctx.roundRect(x - 30, y - 86, 60, 86, 10);
      ctx.fill();
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.shadowBlur = 0;
      // 符号与名称：假提示显示虚假形态，并用危险色标注问号
      ctx.fillStyle = realColor;
      ctx.font = 'bold 22px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(STATE_GLYPH[shownForm], x, y - 52);
      ctx.font = 'bold 15px system-ui';
      ctx.fillText(ob.glyph, x, y - 26);
      ctx.font = '11px system-ui';
      ctx.fillStyle = '#cfd6da';
      ctx.fillText(ob.name, x, y - 10);
      ctx.fillStyle = ob.fakeHint ? pal.danger : realColor;
      ctx.font = 'bold 11px system-ui';
      ctx.fillText(`${FORM_META[shownForm].label}${ob.fakeHint ? ' ?' : ''}`, x, y - 94);
      ctx.restore();
    }
  }

  _drawParticles(particles) {
    const { ctx } = this;
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife) * 0.7;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  _drawFloatTexts(texts) {
    const { ctx } = this;
    ctx.textAlign = 'center';
    for (const t of texts) {
      ctx.globalAlpha = Math.max(0, t.life / t.maxLife);
      ctx.font = `bold ${t.size || 18}px system-ui`;
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }
}

// ===== js/audio.js =====
// 极简合成音效：OscillatorNode 现合成，无音频资源；首次用户交互后创建 AudioContext。
const MUTE_KEY = 'stb_muted';

class Sound {
  constructor() {
    this.ctx = null;
    this.muted = localStorage.getItem(MUTE_KEY) === '1';
  }

  ensureContext() {
    if (!this.ctx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) this.ctx = new Ctx();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }

  toggleMute() {
    this.muted = !this.muted;
    localStorage.setItem(MUTE_KEY, this.muted ? '1' : '0');
    return this.muted;
  }

  blip(kind) {
    if (this.muted) return;
    this.ensureContext();
    if (!this.ctx) return;
    const presets = {
      switch: { freq: 520, dur: 0.07, type: 'square', gain: 0.05 },
      pass: { freq: 660, dur: 0.16, type: 'sine', gain: 0.09 },
      hit: { freq: 150, dur: 0.3, type: 'sawtooth', gain: 0.1 },
      shield: { freq: 420, dur: 0.22, type: 'triangle', gain: 0.09 },
      decision: { freq: 740, dur: 0.18, type: 'sine', gain: 0.08 },
      over: { freq: 110, dur: 0.6, type: 'sawtooth', gain: 0.11 },
      start: { freq: 440, dur: 0.14, type: 'sine', gain: 0.08 },
      unlock: { freq: 880, dur: 0.3, type: 'sine', gain: 0.1 },
    };
    const p = presets[kind] || presets.switch;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = p.type;
    osc.frequency.setValueAtTime(p.freq, t);
    if (kind === 'pass') osc.frequency.exponentialRampToValueAtTime(p.freq * 1.5, t + p.dur);
    if (kind === 'hit' || kind === 'over') osc.frequency.exponentialRampToValueAtTime(p.freq * 0.5, t + p.dur);
    if (kind === 'unlock') osc.frequency.exponentialRampToValueAtTime(p.freq * 2, t + p.dur);
    gain.gain.setValueAtTime(p.gain, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + p.dur);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + p.dur);
  }
}

// ===== js/input.js =====
// 统一输入：只认 Shift 首次 keydown（过滤系统 repeat），上报 blur/visibility 暂停。
class Input {
  constructor() {
    this._downCbs = [];
    this._upCbs = [];
    this._blurCbs = [];
    window.addEventListener('keydown', (e) => {
      if (e.key !== 'Shift' || e.repeat) return;
      e.preventDefault();
      this._downCbs.forEach((cb) => cb());
    });
    window.addEventListener('keyup', (e) => {
      if (e.key !== 'Shift') return;
      this._upCbs.forEach((cb) => cb());
    });
    window.addEventListener('blur', () => this._blurCbs.forEach((cb) => cb()));
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') this._blurCbs.forEach((cb) => cb());
    });
  }

  onShiftDown(cb) { this._downCbs.push(cb); }
  onShiftUp(cb) { this._upCbs.push(cb); }
  onBlur(cb) { this._blurCbs.push(cb); }
}

// UI 表现层（v3）：菜单/捏脸编辑器/四区 HUD/里程奖励弹层/阶段牌/结算/暂停，不含任何玩法规则。



function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

const PART_GROUPS = [
  { type: 'faces', label: '脸型' },
  { type: 'eyes', label: '眼睛' },
  { type: 'mouths', label: '嘴巴' },
  { type: 'hairs', label: '发型' },
  { type: 'outfits', label: '衣服' },
  { type: 'charms', label: '挂件' },
];

class UI {
  constructor(root, storage, partsCfg) {
    this.root = root;
    this.storage = storage;
    this.partsCfg = partsCfg;
    this.on = {};
    this._delegate();
  }

  setSkin(skin) {
    this.root.dataset.skin = skin;
  }

  setScreen(name) {
    this.root.querySelectorAll('.screen').forEach((el) => {
      el.classList.toggle('hidden', el.id !== `screen-${name}`);
    });
  }

  _delegate() {
    this.root.addEventListener('click', (e) => {
      const themeCard = e.target.closest('[data-theme-index]');
      if (themeCard) {
        if (themeCard.dataset.locked === '1') return;
        return this.on.theme?.(Number(themeCard.dataset.themeIndex));
      }
      const partBtn = e.target.closest('[data-part-type]');
      if (partBtn) {
        if (partBtn.dataset.locked === '1') return;
        return this.on.part?.(partBtn.dataset.partType, partBtn.dataset.partId);
      }
      const colorBtn = e.target.closest('[data-color-type]');
      if (colorBtn) return this.on.color?.(colorBtn.dataset.colorType, colorBtn.dataset.colorId);
      const presetBtn = e.target.closest('[data-preset-id]');
      if (presetBtn) {
        if (presetBtn.dataset.locked === '1') return;
        return this.on.preset?.(presetBtn.dataset.presetId);
      }
      const act = e.target.closest('[data-action]');
      if (!act) return;
      ({
        restart: () => this.on.restart?.(),
        menu: () => this.on.menu?.(),
        resume: () => this.on.resume?.(),
        editor: () => this.on.editor?.(),
        'editor-back': () => this.on.editorBack?.(),
        mute: () => {
          const muted = this.on.mute?.();
          act.textContent = muted ? '🔇' : '🔊';
        },
      }[act.dataset.action] || (() => {}))();
    });
    const keyBtn = () => this.root.querySelector('#shift-btn');
    this.root.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#shift-btn')) this.on.pointerShift?.();
    });
    this.root.addEventListener('pointerup', (e) => {
      if (e.target.closest('#shift-btn')) this.on.pointerShiftUp?.();

          </div>
          <div class="editor-controls">
            ${PART_GROUPS.map((g) => `
              <section class="edit-group">
                <h3>${g.label}</h3>
                <div class="chip-row">${partChips(g.type)}</div>
              </section>`).join('')}
            <section class="edit-group">
              <h3>主色（衣服）</h3>
              <div class="swatch-row">${colorSwatches('mainColor')}</div>
            </section>
            <section class="edit-group">
              <h3>强调色（装饰）</h3>
              <div class="swatch-row">${colorSwatches('accentColor')}</div>
            </section>
          </div>
        </div>
      </div>`;
    this._drawAvatar();
  }

  // partsCfg 的数组字段（faces/eyes/...）与 appearance 键（face/eye/...）的映射。
  _appearanceKey(type) {
    const map = { faces: 'face', eyes: 'eyes', mouths: 'mouth', hairs: 'hair', outfits: 'outfit', charms: 'charm' };
    return loadMeta(this.storage).appearance[map[type]];
  }

  _drawAvatar() {
    const canvas = this.root.querySelector('#avatar-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const meta = loadMeta(this.storage);
    const colors = resolveColors(this.partsCfg, meta.appearance);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawPortrait(ctx, canvas.width / 2, canvas.height / 2 + 24, 3.4, meta.appearance, colors, 'happy');
  }

  // ---------------- HUD（四区结构，文档 6.1）----------------

  hudMarkup() {
    return `
      <div class="hud">
        <div class="hud-left">
          <div class="hud-line">
            <span class="hud-stage" id="hud-stage">Stage 1</span>
            <span class="hud-item">分数 <b id="hud-score">0</b></span>
            <span class="hud-item">里程 <b id="hud-distance">0m</b></span>
          </div>
          <div class="hud-sub">
            <span id="hud-hearts" class="hud-hearts"></span>
            <span id="hud-effects" class="hud-effects"></span>
          </div>
        </div>
        <div class="hud-right">
          <span class="hud-forms">
            ${Object.entries(FORM_META).map(([key, m]) => `
              <span class="form-chip" data-form="${key}" style="--form-color:${m.color}">
                <i class="form-glyph">${{ dash: '»', phase: '◌', smash: '✊' }[key]}</i>${m.label}
              </span>`).join('')}
          </span>
          <button class="icon-btn" data-action="mute">${localStorage.getItem('stb_muted') === '1' ? '🔇' : '🔊'}</button>
        </div>
      </div>
      <div id="stage-banner" class="stage-banner hidden"></div>
      <div class="bottom-hint">切换顺序 <b>冲刺 → 相位 → 重击</b> · 按 <span class="kbd">SHIFT</span> 循环</div>
      <div id="toast" class="toast"></div>
      <div id="reward-overlay" class="overlay hidden"></div>
      <div id="result-overlay" class="overlay hidden"></div>
      <div id="pause-overlay" class="overlay hidden">
        <div class="pause-card">
          <h2>已暂停</h2>
          <p>窗口失焦，奔跑已冻结</p>
          <button class="btn" data-action="resume">点击继续</button>
        </div>
      </div>
      <button id="shift-btn" class="shift-btn">SHIFT</button>`;
  }

  updateHud(snap) {
    this.root.querySelector('#hud-hearts').textContent = '❤'.repeat(snap.hearts) + '🤍'.repeat(snap.maxHearts - snap.hearts);
    this.root.querySelector('#hud-score').textContent = String(snap.score);
    this.root.querySelector('#hud-distance').textContent = `${snap.distance}m`;
    this.root.querySelector('#hud-stage').textContent = snap.stageLabel;
    this.root.querySelectorAll('.form-chip').forEach((chip) => {
      chip.classList.toggle('active', chip.dataset.form === snap.form);
    });
    const effects = [
      ...snap.timed.map((t) => `<span class="effect-chip">${escapeHtml(t.label)} ${t.remainSec}s</span>`),
      ...(snap.shields > 0 ? [`<span class="effect-chip">🛡${snap.shields}</span>`] : []),
      ...(snap.deathSave > 0 ? [`<span class="effect-chip">免死×${snap.deathSave}</span>`] : []),
    ];
    this.root.querySelector('#hud-effects').innerHTML = effects.join('');
  }

  showStageBanner(label, rule) {
    const el = this.root.querySelector('#stage-banner');
    el.innerHTML = `<b>${escapeHtml(label)}</b><span>${escapeHtml(rule)}</span>`;
    el.classList.remove('hidden');
  }

  hideStageBanner() {
    this.root.querySelector('#stage-banner')?.classList.add('hidden');
  }

  // ---------------- 10 秒里程奖励弹层 ----------------

  showReward(options, index, remainMs, totalMs, banter) {
    const overlay = this.root.querySelector('#reward-overlay');
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <div class="decision-head">
        <h2>里程奖励</h2>
        <p class="decision-banter">${escapeHtml(banter)}</p>
      </div>
      <div class="decision-cards">
        ${options.map((o, i) => `
          <article class="decision-card ${i === index ? 'selected' : ''}" data-decision-index="${i}">
            <span class="decision-type">${{ score: '高分', survivor: '保命', comfort: '舒适', form: '形态' }[o.category]}</span>
            <h3>${escapeHtml(o.label)}</h3>
            <p>${escapeHtml(o.desc)}</p>
          </article>`).join('')}
      </div>
      <div class="decision-foot">
        <div class="decision-ring"><span id="decision-timer">10.0s</span></div>
        <p>按 <span class="kbd">SHIFT</span> 循环高亮 · 超时自动确认</p>
      </div>`;
    this.updateReward(remainMs, totalMs, index);
  }

  updateReward(remainMs, totalMs, index) {
    this.root.querySelectorAll('.decision-card').forEach((card, i) => {
      card.classList.toggle('selected', i === index);
    });
    const timer = this.root.querySelector('#decision-timer');
    if (timer) timer.textContent = `${(Math.max(0, remainMs) / 1000).toFixed(1)}s`;
    const ring = this.root.querySelector('.decision-ring');
    if (ring) ring.style.setProperty('--dec', `${(remainMs / totalMs) * 360}deg`);
  }

  hideReward() {
    this.root.querySelector('#reward-overlay')?.classList.add('hidden');
  }

  // ---------------- 结算 ----------------

  _partName(id) {
    for (const group of ['faces', 'eyes', 'mouths', 'hairs', 'outfits', 'charms']) {
      const hit = this.partsCfg[group].find((p) => p.id === id);
      if (hit) return hit.name;
    }
    const preset = this.partsCfg.presets.find((p) => p.id === id);
    return preset ? preset.name : id;
  }

  showResult(payload) {
    const { theme, run, score, best, stageLabel, newly } = payload;
    const unlockNames = [
      ...newly.themes.map((id) => `新世界：${this._themes.find((t) => t.themeId === id)?.displayName || id}`),
      ...newly.parts.map((id) => `新配件：${this._partName(id)}`),
      ...newly.presets.map((id) => `新预设：${this._partName(id)}`),
    ];
    const overlay = this.root.querySelector('#result-overlay');
    overlay.innerHTML = `
      <div class="result-card">
        <h2>本局结束 · ${escapeHtml(theme.displayName)}</h2>
        <div class="score-big">${score}<small>分</small></div>
        <div class="result-grid">
          <div><span>到达阶段</span><b>${escapeHtml(stageLabel)}</b></div>
          <div><span>存活里程</span><b>${Math.floor(run.distance)}m</b></div>
          <div><span>最高连击</span><b>x${run.bestCombo}</b></div>
          <div><span>成功通过</span><b>${run.successCount}</b></div>
          <div><span>碰撞次数</span><b>${run.hitCount}</b></div>
          <div><span>奖励次数</span><b>${run.rewardsTaken}</b></div>
          <div><span>历史最高</span><b>${best.score} 分 / ${best.distance}m</b></div>
        </div>
        ${unlockNames.length ? `<div class="unlock-box">🏆 ${unlockNames.map(escapeHtml).join('　')}</div>` : ''}
        <div class="result-actions">
          <button class="btn" data-action="restart">立即重开</button>
          <button class="btn btn-ghost" data-action="menu">回到主菜单</button>
        </div>
        <p class="menu-hint">短按 <span class="kbd">SHIFT</span> 回菜单 · 长按 <span class="kbd">SHIFT</span> 快速重开</p>
      </div>`;
    overlay.classList.remove('hidden');
  }

  hideResult() {
    this.root.querySelector('#result-overlay')?.classList.add('hidden');
  }

  showPause() {
    this.root.querySelector('#pause-overlay')?.classList.remove('hidden');
  }

  hidePause() {
    this.root.querySelector('#pause-overlay')?.classList.add('hidden');
  }

  toast(text, color) {
    const el = this.root.querySelector('#toast');
    el.textContent = text;
    el.style.color = color || '#fff';
    el.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }
}

// ===== js/game.js =====
// RunScene：主游玩场景编排（v3）。玩法规则全部来自 core 纯模块与 JSON，本类只做时序与特效装配。










const PX_PER_METER = 10;
const LONG_PRESS_MS = 800;
const OVER_TO_RESULT_MS = 1400;
const BANNER_MS = 1900;

const PART_KEY = { faces: 'face', eyes: 'eyes', mouths: 'mouth', hairs: 'hair', outfits: 'outfit', charms: 'charm' };
const EFFECT_LABEL = {
  scoreMul: '分数倍率',
  speedMul: '速度修正',
  spawnMul: '障碍稀疏',
  invulnExtend: '坚韧皮肤',
  switchGrace: '切换容错',
};

class GameScene {
  constructor({ canvas, ui, sound, input, storage, themes, rewards, stagesCfg, partsCfg }) {
    this.canvas = canvas;
    this.ui = ui;
    this.sound = sound;
    this.input = input;
    this.storage = storage;
    this.themes = themes;
    this.rewards = rewards;
    this.stagesCfg = stagesCfg;
    this.partsCfg = partsCfg;
    this.renderer = new Renderer(canvas);
    this.mode = 'menu';
    this.paused = false;
    this.menuIndex = 0;
    this.longPressTimer = null;
    this.longPressFired = false;
    this.bannerTimer = null;
    this.expression = 'normal';
    this.expressionUntil = 0;
    this._bindInput();
    this._bindUi();
  }

  _bindInput() {
    this.input.onShiftDown(() => this._onShiftDown());
    this.input.onShiftUp(() => this._onShiftUp());
    this.input.onBlur(() => this.pause());
  }

  _bindUi() {
    this.ui.on.theme = (i) => this.startRun(i);
    this.ui.on.restart = () => this.startRun(this.themeIndex);
    this.ui.on.menu = () => this.showMenu();
    this.ui.on.resume = () => this.resume();
    this.ui.on.mute = () => this.sound.toggleMute();
    this.ui.on.pointerShift = () => this._onShiftDown();
    this.ui.on.pointerShiftUp = () => this._onShiftUp();
    this.ui.on.editor = () => this.openEditor();
    this.ui.on.editorBack = () => this.showMenu();
    this.ui.on.part = (type, id) => {
      saveAppearance(this.storage, { [PART_KEY[type]]: id });
      this.ui.renderEditor();
    };
    this.ui.on.color = (type, id) => {
      saveAppearance(this.storage, { [type]: id });
      this.ui.renderEditor();
    };
    this.ui.on.preset = (id) => {
      applyPreset(this.storage, this.partsCfg, id);
      this.ui.renderEditor();
    };
  }

  // ---------------- 菜单 / 编辑器 ----------------

  showMenu() {
    this.mode = 'menu';
    this.paused = false;
    this.ui.hidePause();
    this.ui.hideResult();
    this.ui.hideReward();
    this.ui.hideStageBanner();
    const meta = loadMeta(this.storage);
    this.ui.setScreen('menu');
    this.ui.renderMenu(this.themes, meta, this.menuIndex);
  }

  openEditor() {
    this.mode = 'editor';
    this.ui.openEditor();
  }

  _onShiftDown() {
    this.sound.ensureContext();
    if (this.paused || this.mode === 'editor') return;
    if (this.mode === 'menu') {
      this.menuIndex = (this.menuIndex + 1) % this.themes.length;
      this.ui.renderMenu(this.themes, loadMeta(this.storage), this.menuIndex);
      this.sound.blip('switch');
      this._armLongPress(() => this.startRun(this.menuIndex));
    } else if (this.mode === 'running') {
      const cd = this.run.modifiers.dashCooldownReduce ? REDUCED_COOLDOWN_MS : SWITCH_COOLDOWN_MS;
      if (cycleForm(this.run.formState, this.run.elapsedMs, cd)) {
        this.sound.blip('switch');
        this._float(this.renderer.playerX, this.renderer.groundY - 96, FORM_META[this.run.formState.form].label, FORM_META[this.run.formState.form].color, 16);
      }
    } else if (this.mode === 'reward') {
      this.reward.index = cycleOptionIndex(this.reward.index, this.reward.options.length);
      this.sound.blip('switch');
    } else if (this.mode === 'over') {
      this._armLongPress(() => this.startRun(this.themeIndex));
    }
  }

  _onShiftUp() {
    clearTimeout(this.longPressTimer);
    const resultVisible = this.ui.root.querySelector('#result-overlay:not(.hidden)');
    if (this.mode === 'over' && !this.longPressFired && resultVisible) this.showMenu();
  }

  _armLongPress(fn) {
    this.longPressFired = false;
    clearTimeout(this.longPressTimer);
    this.longPressTimer = setTimeout(() => {
      this.longPressFired = true;
      fn();
    }, LONG_PRESS_MS);
  }

  // ---------------- 开局 ----------------

  startRun(themeIndex) {
    clearTimeout(this.longPressTimer);
    const meta = loadMeta(this.storage);
    const theme = this.themes[themeIndex];
    if (!meta.unlocked.themes.includes(theme.themeId)) return; // 锁定主题拒绝开局
    this.themeIndex = themeIndex;
    this.theme = theme;
    this.ui.setSkin(theme.uiSkin);
    const seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
    this.run = createRunState(theme, { seed, now: 0, appearance: meta.appearance });
    this.appearance = meta.appearance;
    this.colors = resolveColors(this.partsCfg, this.appearance);
    this.rng = mulberry32(seed);
    this.obstacles = [];
    this.particles = [];
    this.floatTexts = [];
    this.spawnTimerMs = 900;
    this.nodeIndex = 0;
    this.nextNodeM = nodeDistanceAt(0, this.stagesCfg);
    this.shake = 0;
    this.expression = 'normal';
    this.mode = 'running';
    this.paused = false;
    this.ui.hidePause();
    this.ui.setScreen('game');
    this.renderer.resize(); // 游戏屏从隐藏切换后需要重新测量画布尺寸
    this.ui.toast(this._banter('runStart'), this.theme.palette.primary);
    this.sound.blip('start');
    this.lastTs = 0;
    if (!this.rafId) this._raf(performance.now());
  }

  // ---------------- 主循环 ----------------

  _raf(ts) {
    this.rafId = requestAnimationFrame((t) => this._raf(t));
    if (!this.lastTs) this.lastTs = ts;
    let dt = ts - this.lastTs;
    this.lastTs = ts;
    // 长帧上钳避免穿透；下钳 0 防止时间戳回退（开局首帧/定时器抖动）导致距离与背景倒转
    dt = Math.max(0, Math.min(50, dt));
    if (!this.paused && this.mode !== 'menu' && this.mode !== 'editor') {
      if (this.mode === 'running') this._updateRunning(dt);
      else if (this.mode === 'reward') this._updateReward(dt);
      this._updateEffects(dt);
    }
    if (this.run) this._draw(ts);
  }

  _updateRunning(dt) {
    const run = this.run;
    run.elapsedMs += dt;
    tickEffects(run, run.elapsedMs);
    const stage = resolveStage(run.distance, this.stagesCfg);
    this.stage = stage;
    const speedPx = currentSpeed(run, stage, run.elapsedMs) * formSpeedMul(run.formState.form);
    const dtSec = dt / 1000;
    run.distance += (speedPx * dtSec) / PX_PER_METER;
    this.renderer.scroll(speedPx * dtSec);

    // 生成障碍组合
    this.spawnTimerMs -= dt;
    if (this.spawnTimerMs <= 0) {
      this._spawnGroup(speedPx, stage);
      this.spawnTimerMs = nextSpawnIntervalMs(stage, this.rng, run, run.elapsedMs);
    }
    // 移动 + 碰撞
    for (const ob of this.obstacles) {
      ob.x -= speedPx * dtSec;
      ob.currentForm = run.formState.form;
      if (!ob.resolved && ob.x <= this.renderer.playerX + 24) {
        ob.resolved = true;
        this._resolve(ob);
      }
    }
    this.obstacles = this.obstacles.filter((ob) => ob.x > -80);

    // 里程节点 → 10 秒奖励
    if (run.distance >= this.nextNodeM) {
      this._enterReward();
      return;
    }
    if (run.over) {
      this._endRun();
      return;
    }
    this.ui.updateHud(this._hudSnapshot(stage));
  }

  _spawnGroup(speedPx, stage) {
    const startX = this.renderer.w + 50;
    const last = this.obstacles[this.obstacles.length - 1];
    const gap = Math.max(96, minGapPx(speedPx));
    if (last && startX - last.x < gap + 70) return; // 间距不足本轮跳过
    const group = spawnGroup(this.rng, this.theme.obstaclePool, stage);
    group.forEach((ob, i) => {
      this.obstacles.push({ ...ob, x: startX + i * (60 + gap), resolved: false, currentForm: this.run.formState.form });
    });
  }

  _resolve(ob) {
    const outcome = resolveCollision(ob, this.run, this.run.elapsedMs);
    const x = this.renderer.playerX;
    const y = this.renderer.groundY - 50;
    if (outcome.result === RESULT.PASS) {
      this._burst(x, y, this.theme.palette.primary, 9);
      this._float(x, y - 20, `+${outcome.gain}`, this.theme.palette.primary, 20);
      this.sound.blip('pass');
      this._setExpression('happy', 700);
    } else if (outcome.result === RESULT.GRACE) {
      this._float(x, y - 20, '容错', '#6fb8d9', 15);
      this.sound.blip('shield');
    } else if (outcome.result === RESULT.SHIELD) {
      this._burst(x, y, '#9db8d8', 10);
      this._float(x, y - 20, '护盾抵消', '#9db8d8', 17);
      this.sound.blip('shield');
    } else if (outcome.result === RESULT.DEATH_SAVE) {
      this._burst(x, y, '#e8c86a', 12);
      this._float(x, y - 20, '免死！', '#e8c86a', 19);
      this.sound.blip('shield');
    } else {
      this.shake = 9; // 抖屏弱化：幅度更小、恢复更快
      this._burst(x, y, this.theme.palette.danger, 10);
      this._float(x, y - 20, '碰撞 -1', this.theme.palette.danger, 19);
      this.ui.toast(this._banter('hit'), this.theme.palette.danger);
      this.sound.blip('hit');
      this._setExpression('hurt', 900);
    }
    this.ui.updateHud(this._hudSnapshot(this.stage));
  }

  // ---------------- 10 秒里程奖励 ----------------

  _enterReward() {
    this.mode = 'reward';
    const options = this.nodeIndex < this.stagesCfg.nodeRewards.length
      ? rollNodeRewards(this.nodeIndex, this.rewards, this.stagesCfg)
      : rollLoopRewards(this.rng, this.rewards, this.run);
    this.reward = { options, index: 0, remainMs: this.stagesCfg.decisionWindowMs, totalMs: this.stagesCfg.decisionWindowMs };
    this.ui.showReward(options, 0, this.reward.remainMs, this.reward.totalMs, this._banter('reward'));
    this.sound.blip('decision');
  }

  _updateReward(dt) {
    this.reward.remainMs -= dt;
    this.ui.updateReward(this.reward.remainMs, this.reward.totalMs, this.reward.index);
    if (this.reward.remainMs <= 0) this._finishReward();
  }

  _finishReward() {
    const option = autoSelect(this.reward.options, this.reward.index);
    applyReward(this.run, option, this.run.elapsedMs);
    this._float(this.renderer.playerX, this.renderer.groundY - 110, option.label, this.theme.palette.primary, 18);
    this.ui.hideReward();
    this.nodeIndex += 1;
    this.nextNodeM = nodeDistanceAt(this.nodeIndex, this.stagesCfg);
    this.mode = 'running';
    this.lastTs = 0;
    // 进入新阶段：展示阶段牌
    const banner = stageBanner(this.run.distance, this.stagesCfg);
    this.ui.showStageBanner(banner.label, banner.rule);
    clearTimeout(this.bannerTimer);
    this.bannerTimer = setTimeout(() => this.ui.hideStageBanner(), BANNER_MS);
    this.ui.updateHud(this._hudSnapshot(resolveStage(this.run.distance, this.stagesCfg)));
  }

  // ---------------- 结束与结算 ----------------

  _endRun() {
    this.mode = 'over';
    this.shake = 12;
    this._setExpression('hurt', 1200);
    this._burst(this.renderer.playerX, this.renderer.groundY - 50, this.theme.palette.danger, 16);
    this.sound.blip('over');
    setTimeout(() => {
      if (this.mode !== 'over') return;
      const score = totalScore(this.run);
      const { meta, newly } = recordRun(this.storage, this.themes, this.partsCfg, this.run, score);
      if (newly.themes.length || newly.parts.length || newly.presets.length) this.sound.blip('unlock');
      const banner = stageBanner(this.run.distance, this.stagesCfg);
      this.ui.showResult({
        theme: this.theme,
        run: this.run,
        score,
        best: meta.best[this.run.themeId],
        stageLabel: banner.label,
        newly,
      });
    }, OVER_TO_RESULT_MS);
  }

  // ---------------- 暂停 ----------------

  pause() {
    if (this.paused || this.mode === 'menu' || this.mode === 'over' || this.mode === 'editor') return;
    this.paused = true;
    clearTimeout(this.longPressTimer);
    this.ui.showPause();
  }

  resume() {
    if (!this.paused) return;
    this.paused = false;
    this.lastTs = 0;
    this.ui.hidePause();
  }

  // ---------------- 表情 / 特效与 HUD ----------------

  _setExpression(kind, ms) {
    this.expression = kind;
    this.expressionUntil = this.run.elapsedMs + ms;
  }

  _currentExpression() {
    return this.run.elapsedMs < this.expressionUntil ? this.expression : 'normal';
  }

  _burst(x, y, color, n) {
    for (let i = 0; i < n; i += 1) {
      const angle = (Math.PI * 2 * i) / n + this.rng();
      const speed = 70 + this.rng() * 130;
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 50,
        r: 2 + this.rng() * 2.4,
        color,
        life: 520, maxLife: 520,
      });
    }
  }

  _float(x, y, text, color, size) {
    this.floatTexts.push({ x, y, text, color, size, life: 850, maxLife: 850 });
  }

  _updateEffects(dt) {
    const dtSec = dt / 1000;
    for (const p of this.particles) {
      p.x += p.vx * dtSec;
      p.y += p.vy * dtSec;
      p.vy += 280 * dtSec;
      p.life -= dt;
    }
    this.particles = this.particles.filter((p) => p.life > 0);
    for (const t of this.floatTexts) {
      t.y -= 30 * dtSec;
      t.life -= dt;
    }
    this.floatTexts = this.floatTexts.filter((t) => t.life > 0);
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 0.08);
  }

  _draw(now) {
    const invuln = this.run.elapsedMs < this.run.invulnUntil;
    this.renderer.render({
      theme: this.theme,
      run: this.run,
      obstacles: this.obstacles,
      particles: this.particles,
      floatTexts: this.floatTexts,
      now: this.run.elapsedMs,
      appearance: this.appearance,
      colors: this.colors,
      invuln,
      shake: this.shake,
      expression: this._currentExpression(),
    });
  }

  _hudSnapshot(stage) {
    const timed = activeTimedEffects(this.run, this.run.elapsedMs).map((e) => ({
      label: EFFECT_LABEL[e.key] || e.key,
      remainSec: Math.ceil((e.expireAt - this.run.elapsedMs) / 1000),
    }));
    return {
      hearts: this.run.hearts,
      maxHearts: this.run.maxHearts,
      form: this.run.formState.form,
      score: totalScore(this.run),
      distance: Math.floor(this.run.distance),
      stageLabel: stage.loopLevel > 0 ? `Stage 4+${stage.loopLevel}` : `Stage ${stage.stageIndex}`,
      timed,
      shields: this.run.modifiers.shieldCharges,
      deathSave: this.run.modifiers.deathSave,
    };
  }

  _banter(key) {
    const lines = this.theme.banter[key];
    return lines[Math.floor(this.rng() * lines.length)];
  }
}

// ===== js/main.js =====
// 装配根：加载主题世界包、阶段配置、奖励池、捏脸部件 → 组装 RunScene/UI/输入/音效。
// 新增世界只需加一份主题 JSON；玩法规则只存在于 core 纯模块与 JSON 配置。





const THEME_FILES = ['prod-incident.json', 'night-store.json', 'haunted-toaster.json'];

function failFast(msg) {
  document.body.innerHTML = `<pre style="color:#ff8a8a;padding:24px;font-size:16px">启动失败：${msg}</pre>`;
  throw new Error(msg);
}

async function loadJson(path) {
  const res = await fetch(path);
  if (!res.ok) failFast(`${path} 加载失败（HTTP ${res.status}），请通过本地静态服务器访问`);
  return res.json();
}

async function bootstrap() {
  const [themes, stagesCfg, rewards, partsCfg] = await Promise.all([
    Promise.all(THEME_FILES.map((f) => loadJson(`data/themes/${f}`))),
    loadJson('data/stages.json'),
    loadJson('data/rewards.json'),
    loadJson('data/character-parts.json'),
  ]);
  for (const t of themes) {
    if (!t.themeId || !Array.isArray(t.obstaclePool)) failFast(`主题包 ${t.themeId} 结构非法`);
  }

  initMeta(localStorage, partsCfg); // 新玩家首局前也能使用默认配件捏脸
  const app = document.getElementById('app');
  const canvas = document.getElementById('game-canvas');
  const ui = new UI(app, localStorage, partsCfg);
  document.getElementById('hud-layer').innerHTML = ui.hudMarkup();

  const scene = new GameScene({
    canvas,
    ui,
    sound: new Sound(),
    input: new Input(),
    storage: localStorage,
    themes,
    rewards,
    stagesCfg,
    partsCfg,
  });
  scene.showMenu();
}

bootstrap().catch((err) => failFast(err.message));
  </script>
